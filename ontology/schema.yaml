id: https://w3id.org/kr-employment/
name: employment
title: 고용 분야 ontology
description: 고용24가 다루는 고용 분야의 RDF 모델이다. class와 property는 표준의 이름을 그대로 쓰고, 각 이름은 표준 IRI에 대응한다.
comments:
  - 노트의 frontmatter는 작성용 형식이다. `scripts/vault.py`가 frontmatter를 이 모델의 instance와 노트 문서로 옮긴다.
  - 표준에 없는 개념은 `employment:` 이름공간에 정의하고, 이유를 해당 class나 property의 comments에 적는다.
prefixes:
  linkml: https://w3id.org/linkml/
  employment: https://w3id.org/kr-employment/
  cpsv: http://purl.org/vocab/cpsv#
  cv: http://data.europa.eu/m8g/
  eli: http://data.europa.eu/eli/ontology#
  skos: http://www.w3.org/2004/02/skos/core#
  foaf: http://xmlns.com/foaf/0.1/
  prov: http://www.w3.org/ns/prov#
  sdo: https://schema.org/
  dct: http://purl.org/dc/terms/
  org: http://www.w3.org/ns/org#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  spdx: http://spdx.org/rdf/terms#
default_prefix: employment
default_range: string
imports:
  - linkml:types

enums:
  CreativeWorkStatus:
    description: 노트의 편집 상태
    permissible_values:
      draft:
        description: LLM이 만들거나 고친 상태
        meaning: employment:status-draft
      verified:
        description: 별도 agent나 생성 스크립트가 원문과 대조한 상태
        meaning: employment:status-verified
      reviewed:
        description: 사람이 승인한 상태
        meaning: employment:status-reviewed
  SubdivisionType:
    description: 법령 하위 단위의 종류
    permissible_values:
      chapter:
        description: 장
        meaning: employment:subdivision-chapter
      section:
        description: 절
        meaning: employment:subdivision-section
      article:
        description: 조
        meaning: employment:subdivision-article
      paragraph:
        description: 항
        meaning: employment:subdivision-paragraph
      point:
        description: 호
        meaning: employment:subdivision-point
      subpoint:
        description: 목
        meaning: employment:subdivision-subpoint
      lead:
        description: 각 호 외의 부분
        meaning: employment:subdivision-lead
      annex:
        description: 별표
        meaning: employment:subdivision-annex
      remarks:
        description: 별표의 비고
        meaning: employment:subdivision-remarks
      form:
        description: 별지 서식
        meaning: employment:subdivision-form
      addendum:
        description: 부칙
        meaning: employment:subdivision-addendum
  HitPolicy:
    description: 결정표에서 여러 행이 맞을 때의 처리 방식
    comments:
      - 값은 DMN 1.3의 hit policy 이름을 그대로 쓴다.
    permissible_values:
      UNIQUE:
        description: 맞는 행이 하나뿐이어야 함
      FIRST:
        description: 맞는 행 중 첫 번째 행의 결과
      ANY:
        description: 맞는 행들의 결과가 모두 같아야 함

classes:
  NamedThing:
    abstract: true
    description: 모든 wiki 노트가 설명하는 instance의 공통 property를 정의하는 추상 class
    slots:
      - type
      - identifier
      - prefLabel
      - aliases
      - definition
      - validFrom
      - validThrough
      - isReplacedBy
    slot_usage:
      definition:
        required: true

  NoteDocument:
    class_uri: foaf:Document
    description: wiki 노트 자체
    comments:
      - 노트 하나는 instance 하나를 설명하고, 출처와 편집 상태는 노트에 붙는다.
    slots:
      - identifier
      - primaryTopic
      - source
      - status
      - reviewedBy
      - lastReviewed
    slot_usage:
      identifier:
        description: instance의 identifier 뒤에 -note를 붙인 식별자
      primaryTopic:
        required: true
      source:
        required: true
      status:
        required: true

  PublicService:
    is_a: NamedThing
    class_uri: cpsv:PublicService
    description: 공공기관이 제공하는 서비스(급여와 신청 절차 포함)
    annotations:
      examples: 실업급여, 구직급여, 실업의 신고, 피보험자격 상실 신고
    slots:
      - hasCompetentAuthority
      - audience
      - follows
      - hasChannel
      - hasInputType
      - hasLegalResource
      - hasPart
      - hasParticipation
      - holdsRequirement
      - isGroupedBy
      - produces
      - relatedService
      - requires
    slot_usage:
      hasCompetentAuthority:
        required: true
      hasPart:
        range: PublicService
        description: 하위 서비스

  Event:
    is_a: NamedThing
    abstract: true
    class_uri: cv:Event
    description: 공공서비스가 필요해지는 사건

  LifeEvent:
    is_a: Event
    class_uri: cv:LifeEvent
    description: 공공서비스가 필요해지는 개인의 사건
    annotations:
      examples: 이직, 재취업

  BusinessEvent:
    is_a: Event
    class_uri: cv:BusinessEvent
    description: 공공서비스가 필요해지는 사업장의 사건
    annotations:
      examples: 근로자의 이직

  Agent:
    is_a: NamedThing
    abstract: true
    class_uri: foaf:Agent
    description: 서비스에 참여하는 당사자

  PublicOrganisation:
    is_a: Agent
    class_uri: cv:PublicOrganisation
    description: 공공기관
    annotations:
      examples: 고용노동부, 근로복지공단
    slots:
      - subOrganizationOf

  Participation:
    is_a: NamedThing
    class_uri: cv:Participation
    description: 서비스에서 당사자가 맡는 역할과 그 역할의 의무
    annotations:
      examples: 피보험자격 상실 신고에서 사업주가 맡는 신고 의무
    comments:
      - 사업주, 피보험자 같은 당사자 유형은 `role`의 Concept로 적고 `hasParticipant`는 비워 둔다. CPSV-AP는 `hasParticipant`를 필수로 두지만, 법령이 정한 당사자 유형은 특정 Agent가 아니다.
      - 역할에 딸린 기한 같은 의무는 `holdsRequirement`로 적는다. CPSV-AP는 이 property를 PublicService에만 두므로 Participation에 쓰는 것은 확장이다.
    slots:
      - role
      - hasParticipant
      - holdsRequirement
    slot_usage:
      role:
        required: true

  Channel:
    is_a: NamedThing
    class_uri: cv:Channel
    description: 서비스를 이용하는 경로
    annotations:
      examples: 고용24 누리집, 직업안정기관 출석
    slots:
      - ownedBy

  Output:
    is_a: NamedThing
    class_uri: cv:Output
    description: 서비스가 만들어 내는 결과
    annotations:
      examples: 수급자격 인정, 수급자격증

  Rule:
    is_a: NamedThing
    class_uri: cpsv:Rule
    description: 서비스가 따르는 산정·판단 규칙
    annotations:
      examples: 구직급여일액 산정, 소정급여일수 산정
    comments:
      - 식은 FEEL literal expression으로, 표는 결정표로 적는다. 둘 중 하나만 적는다.
      - 경과조치처럼 규칙이 일부 경우에만 적용되면 그 조건을 `appliesWhen`으로 잇는다.
      - 단서나 예외처럼 규칙이 다루지 않는 경우는 그 경우가 아님을 판단하는 Criterion을 `appliesWhen`으로 이어 뺀다.
    slots:
      - implements
      - variable
      - appliesWhen
      - requiredInput
      - literalExpression
      - decisionTable
    slot_usage:
      implements:
        required: true
      variable:
        required: true
    exactly_one_of:
      - slot_conditions:
          literalExpression:
            required: true
      - slot_conditions:
          decisionTable:
            required: true

  Requirement:
    is_a: NamedThing
    abstract: true
    class_uri: cv:Requirement
    description: Criterion과 Constraint의 상위 class
    slots:
      - hasConcept
      - appliesWhen
      - hasEvidenceTypeList
      - hasRequirement
      - isDerivedFrom
      - unaryTests

  Criterion:
    is_a: Requirement
    class_uri: cv:Criterion
    description: 서비스를 받으려면 충족해야 하는 조건
    annotations:
      examples: 기준기간 동안의 피보험 단위기간 180일 이상, 2026-01-01 이후 이직

  Constraint:
    is_a: Requirement
    class_uri: cv:Constraint
    description: 정보 값에 거는 기한·상한·하한 같은 제한
    annotations:
      examples: 기초일액 상한 11만3500원, 이직확인서 발급 기한 10일
    comments:
      - 기한은 지켜야 하는 행위의 날짜를 `constrains`로 두고, 법령 문구대로 정의한 기한일 정보 항목과 `<=`로 비교한다.
      - 기간의 첫날 산입처럼 법령 노트만으로 정할 수 없는 기한일 계산은 기한일 노트에 질문으로 남긴다.
    slots:
      - constrains
    slot_usage:
      constrains:
        required: true
      unaryTests:
        required: true

  InformationConcept:
    is_a: NamedThing
    class_uri: cv:InformationConcept
    description: 조건과 규칙이 판단하는 정보 항목
    annotations:
      examples: 피보험 단위기간, 이직일, 기초일액, 이직사유
    slots:
      - typeRef
      - unitCode
      - currency
      - conformsTo
    slot_usage:
      typeRef:
        required: true
      conformsTo:
        range: ConceptScheme
        description: 값으로 쓸 수 있는 코드 체계
        comments:
          - 값은 그 체계의 개념이고, FEEL에서는 개념의 `notation`을 값으로 쓴다.

  EvidenceTypeList:
    class_uri: cv:EvidenceTypeList
    description: 함께 내야 하는 증빙 유형의 목록
    slots:
      - specifiesEvidenceType
    slot_usage:
      specifiesEvidenceType:
        required: true

  EvidenceType:
    is_a: NamedThing
    class_uri: cv:EvidenceType
    description: 증빙 서류의 유형
    annotations:
      examples: 피보험자 이직확인서
    slots:
      - isDefinedBy

  Work:
    is_a: NamedThing
    abstract: true
    class_uri: eli:Work
    description: 법령과 그 하위 단위의 공통 상위 class
    slots:
      - title
      - idLocal
      - basedOn
      - cites
      - isRealizedBy
    slot_usage:
      definition:
        required: false

  LegalResource:
    is_a: Work
    class_uri: eli:LegalResource
    description: 시행일 버전과 무관한 법령
    annotations:
      examples: 고용보험법, 2026년 적용 최저임금 고시
    comments:
      - 법률, 시행령, 시행규칙, 고시를 포함한다.
      - "identifier는 법령이면 law-<법령ID>, 행정규칙이면 admrul-<행정규칙ID>다."
    slots:
      - typeDocument
    slot_usage:
      typeDocument:
        required: true
      title:
        required: true

  LegalResourceSubdivision:
    is_a: Work
    class_uri: eli:LegalResourceSubdivision
    description: 시행일 버전과 무관한 법령의 하위 단위
    annotations:
      examples: 고용보험법 제40조, 고용보험법 별표 1, 고용보험법 시행규칙 별지 제6호서식
    comments:
      - 장, 절, 조, 별표, 별지 서식, 부칙은 노트로 두고, 항, 호, 목은 노트의 block으로 둔다.
      - "identifier는 소속 법령의 identifier 뒤에 단위를 붙인다. 조는 -art-40, 가지번호는 -art-10-2, 장은 -ch-4, 장의2는 -ch-5-2, 절은 -ch-4-sec-2다."
      - "별표는 -annex-1, 별표 1의2는 -annex-1-2, 별지 서식은 -form-6, 부칙은 -sup-<공포일자>-<공포번호>다. 공포번호가 같은 부칙이 있어 공포일자를 붙인다."
      - "버전과 무관한 block은 소속 노트의 identifier 뒤에 날짜를 뺀 block ID를 붙인다. 고용보험법 제45조제5항은 law-001761-art-45-p5다."
    slots:
      - isPartOf
      - typeSubdivision
      - number
    slot_usage:
      isPartOf:
        required: true
        range: Work
      typeSubdivision:
        required: true
      number:
        description: 제40조, 제1항, 별표 1 같은 하위 단위 번호

  LegalExpression:
    class_uri: eli:LegalExpression
    description: 법령이나 그 하위 단위의 시행일 버전 하나
    comments:
      - 같은 시행일자에 법령일련번호(MST)가 여럿이면 공포일자가, 그다음 공포번호가 늦은 버전을 쓴다.
      - "identifier는 실현하는 Work의 identifier 뒤에 -v<시행일자>를 붙인다. block 버전은 노트의 block ID를 그대로 붙여 law-001761-art-45-v20260918-p5처럼 쓰고, law-001761-art-45-p5를 실현한다."
      - 시행일자는 그 단위가 이 본문을 처음 가진 법령 버전의 시행일자다.
      - 버전 사이의 포함 관계는 실현하는 Work의 `isPartOf`로 나타낸다. ELI 1.4의 eli:is_part_of는 Work에만 쓴다.
    slots:
      - identifier
      - realizes
      - firstDateEntryInForce
      - dateNoLongerInForce
      - datePublication
      - idLocal
      - number
      - text
      - wasDerivedFrom
    slot_usage:
      identifier:
        description: 버전의 kebab-case 식별자
      realizes:
        required: true
      firstDateEntryInForce:
        required: true
      idLocal:
        description: 법령일련번호(MST)나 행정규칙일련번호
      number:
        description: 공포번호나 발령번호
      text:
        description: 정규화한 block 본문

  ConceptScheme:
    is_a: NamedThing
    class_uri: skos:ConceptScheme
    description: 용어집과 코드 체계
    annotations:
      examples: 피보험자격 상실사유 구분코드, 고용보험 당사자 유형, 정당한 이직 사유

  Concept:
    is_a: NamedThing
    class_uri: skos:Concept
    description: 용어, 코드 값, 당사자 유형, 사유 목록의 항목
    annotations:
      examples: 상실사유 구분코드 23, 사업주
    slots:
      - inScheme
      - notation
      - broader
      - exactMatch
      - related
    slot_usage:
      inScheme:
        required: true

  DecisionTable:
    class_uri: employment:DecisionTable
    description: Rule의 결정표
    comments:
      - DMN 1.3의 tDecisionTable에 대응한다. DMN은 XML schema만 공개하고 RDF 어휘가 없어서 `employment:` 이름공간에 둔다.
    slots:
      - hitPolicy
      - input
      - output
      - rule
    slot_usage:
      hitPolicy:
        required: true
      input:
        required: true
      output:
        required: true
      rule:
        required: true

  InputClause:
    class_uri: employment:InputClause
    description: 결정표의 입력 열
    comments:
      - DMN 1.3의 tInputClause에 대응한다.
    slots:
      - position
      - inputExpression
    slot_usage:
      position:
        required: true
      inputExpression:
        required: true

  OutputClause:
    class_uri: employment:OutputClause
    description: 결정표의 출력 열
    comments:
      - DMN 1.3의 tOutputClause에 대응한다.
    slots:
      - position
      - name
    slot_usage:
      position:
        required: true
      name:
        required: true

  DecisionRule:
    class_uri: employment:DecisionRule
    description: 결정표의 한 행
    comments:
      - DMN 1.3의 tDecisionRule에 대응한다.
    slots:
      - position
      - inputEntry
      - outputEntry
    slot_usage:
      position:
        required: true
      inputEntry:
        required: true
      outputEntry:
        required: true

  UnaryTests:
    class_uri: employment:UnaryTests
    description: 결정표 한 칸의 입력 조건
    comments:
      - DMN 1.3의 tUnaryTests에 대응한다. `position`은 같은 위치의 입력 열을 가리킨다.
    slots:
      - position
      - text
    slot_usage:
      position:
        required: true
      text:
        required: true
        description: FEEL unary tests

  LiteralExpression:
    class_uri: employment:LiteralExpression
    description: 결정표 한 칸의 출력 값
    comments:
      - DMN 1.3의 tLiteralExpression에 대응한다. `position`은 같은 위치의 출력 열을 가리킨다.
    slots:
      - position
      - text
    slot_usage:
      position:
        required: true
      text:
        required: true
        description: FEEL 식

  Entity:
    class_uri: prov:Entity
    description: "`raw/` 노트의 원문 한 건"
    comments:
      - "identifier는 raw-<출처>-<원문 식별자>-<수집 일시>다. 법령은 raw-law-001761-20260918-284449-20261015t1030처럼 쓴다."
    slots:
      - identifier
      - title
      - publisher
      - url
      - generatedAtTime
      - sha256
      - license
      - modified
      - hasPart
    slot_usage:
      identifier:
        required: true
      title:
        required: true
      publisher:
        required: true
      url:
        required: true
      generatedAtTime:
        required: true
      sha256:
        required: true
      license:
        required: true
      hasPart:
        range: Quotation
        inlined_as_list: true
        description: Git에 남기는 짧은 인용

  Quotation:
    class_uri: sdo:Quotation
    description: 원문을 Git에 두지 않는 출처에서 인용한 짧은 문장
    comments:
      - 저작권법 제28조의 범위에서 출처를 밝혀 인용한다.
    slots:
      - identifier
      - text
      - sha256
    slot_usage:
      identifier:
        required: true
      text:
        required: true
      sha256:
        required: true

  Container:
    tree_root: true
    description: "`scripts/vault.py`가 검증에 쓰는 묶음"
    comments:
      - RDF로 옮기지 않는다.
    slots:
      - things
      - documents
      - expressions
      - sources

slots:
  type:
    slot_uri: rdf:type
    designates_type: true
    range: uriorcurie
    required: true
    description: Classes 표의 이름
  identifier:
    slot_uri: dct:identifier
    identifier: true
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    description: 바뀌지 않는 kebab-case 식별자
    comments:
      - instance의 IRI는 base IRI 뒤에 identifier를 붙여 만든다.
  prefLabel:
    slot_uri: skos:prefLabel
    required: true
    description: 노트의 파일 이름
  aliases:
    slot_uri: skos:altLabel
    multivalued: true
    description: 다른 이름 목록
  definition:
    slot_uri: skos:definition
    description: 한 문장 정의
  validFrom:
    slot_uri: sdo:validFrom
    range: date
    description: 달력상 적용 시작일
  validThrough:
    slot_uri: sdo:validThrough
    range: date
    description: 달력상 적용 종료일
