[project]
name = "employment-ontology"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "linkml>=1.9",
    "pyyaml>=6",
    "pyshacl>=0.26",
    "pypdf>=5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
